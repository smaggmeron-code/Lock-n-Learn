<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>鎖上學 · 寫字解鎖</title>
  <meta name="description" content="孩子想玩 iPad？先寫一個中文字。寫對了，遊戲才會打開。">
  <meta name="theme-color" content="#faf3e8">
  <meta property="og:title" content="鎖上學 · 寫字解鎖">
  <meta property="og:description" content="孩子想玩 iPad？先寫一個中文字。">
  <meta property="og:image" content="https://smaggmeron-code.github.io/Lock-n-Learn/get-wo.jpg">
  <link rel="apple-touch-icon" href="get-icon.png">
  <link rel="icon" href="get-icon.png">
  <style>
    :root {
      --bg: #faf3e8;
      --ink: #26221f;
      --grey: #7d7873;
      --red: #c25a55;
      --teal: #2f978a;
      --teal-dark: #267e73;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      text-align: center;
    }
    /* First screen = the video's end card, so the tap feels like the same ad continuing. */
    .card {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem calc(2rem + env(safe-area-inset-bottom));
    }
    .icon { width: 7.5rem; height: 7.5rem; border-radius: 1.7rem; }
    h1 { font-size: 3.6rem; line-height: 1.1; font-weight: 900; letter-spacing: .04em; margin: 1.1rem 0 .3rem; }
    .en { color: var(--grey); font-size: 1.35rem; margin: 0; }
    .tag { color: var(--red); font-size: 2.1rem; font-weight: 900; letter-spacing: .06em; margin: 1.2rem 0 1rem; }

    .cta {
      display: block;
      width: 100%;
      max-width: 19rem;
      background: var(--teal);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      padding: .9rem 1.5rem .8rem;
      box-shadow: 0 8px 22px rgba(47,151,138,.3);
      transition: background .15s, transform .1s;
    }
    .cta:hover { background: var(--teal-dark); }
    .cta:active { transform: scale(.97); }
    .cta b { display: block; font-size: 1.75rem; font-weight: 900; letter-spacing: .05em; line-height: 1.25; }
    .cta span { display: block; font-size: .95rem; opacity: .92; }
    .note { color: var(--grey); font-size: .85rem; margin: .8rem 0 0; }

    /* Below the fold: one picture, one line, the same button again. */
    .more { max-width: 26rem; margin: 0 auto; padding: 1rem 1.25rem 2.5rem; }
    .more p { font-size: 1.2rem; font-weight: 700; margin: 0 0 1.2rem; }
    .shot {
      display: block;
      width: 78%;
      max-width: 17rem;
      height: auto;
      margin: 0 auto 1.8rem;
      border-radius: 1.6rem;
      border: 6px solid #fff;
      box-shadow: 0 14px 40px rgba(31,27,24,.12);
    }
    .more .cta { margin: 0 auto; }

    footer { color: var(--grey); font-size: .8rem; padding: 0 1.25rem calc(2rem + env(safe-area-inset-bottom)); }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <section class="card">
    <img class="icon" src="get-icon.png" alt="" width="120" height="120">
    <h1>鎖上學</h1>
    <p class="en">Lock &amp; Learn</p>
    <p class="tag">寫字解鎖</p>
    <a class="cta" data-tap="top" href="https://apps.apple.com/app/apple-store/id6811321479?pt=129418115&amp;ct=fb-ad03&amp;mt=8">
      <b>免費試用 7 天</b>
      <span>App Store 下載</span>
    </a>
    <p class="note">iPhone / iPad · 不用註冊</p>
  </section>

  <section class="more">
    <p>孩子想玩 iPad？先寫一個中文字。</p>
    <img class="shot" src="get-wo.jpg" width="571" height="900" alt="鎖上學：看注音，寫出「我」字">
    <a class="cta" data-tap="bottom" href="https://apps.apple.com/app/apple-store/id6811321479?pt=129418115&amp;ct=fb-ad03&amp;mt=8">
      <b>免費試用 7 天</b>
      <span>App Store 下載</span>
    </a>
  </section>

  <footer>
    <a href="privacy.html">隱私權 · Privacy</a>
    <p class="owner">© 2026 Brendan Mullan · Lock &amp; Learn 鎖上學</p>
  </footer>

  <script>
    // Anonymous counts only: no cookies, nothing sent to Meta.
    (function () {
      var host = location.hostname;
      if (!/github\.io$/.test(host)) return; // don't count local previews
      var base = "https://abacus.jasoncameron.dev/hit/locknlearn-tw/";
      function hit(key) {
        try { fetch(base + key, { mode: "no-cors", keepalive: true }); } catch (e) {}
      }
      hit("get-view");
      document.querySelectorAll("[data-tap]").forEach(function (a) {
        a.addEventListener("click", function () {
          hit("get-tap");
          hit("get-tap-" + a.getAttribute("data-tap"));
        });
      });
    })();
  </script>
</body>
</html>
