<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>鎖上學 · 先寫字，再玩 iPad</title>
  <meta name="description" content="孩子想玩 iPad？先寫一個中文字。寫對了，遊戲才會打開。">
  <meta name="theme-color" content="#fdfbf7">
  <meta property="og:title" content="鎖上學 · 先寫字，再玩 iPad">
  <meta property="og:description" content="孩子想玩 iPad？先寫一個中文字。">
  <meta property="og:image" content="https://smaggmeron-code.github.io/Lock-n-Learn/get-wo.jpg">
  <link rel="apple-touch-icon" href="get-icon.png">
  <link rel="icon" href="get-icon.png">
  <style>
    :root {
      --bg: #fdfbf7;
      --ink: #1f1b18;
      --muted: #6b645f;
      --teal: #2f8a73;
      --teal-dark: #24705d;
      --line: #ece6dd;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 26rem; margin: 0 auto; padding: 1.5rem 1.25rem 2.5rem; }

    .brand { display: inline-flex; align-items: center; gap: .55rem; font-weight: 600; font-size: .95rem; color: var(--muted); }
    .brand img { width: 2rem; height: 2rem; border-radius: .5rem; }

    h1 { font-size: 2rem; line-height: 1.25; letter-spacing: .01em; margin: 1.6rem 0 .6rem; font-weight: 800; }
    .sub { color: var(--muted); font-size: 1.1rem; margin: 0 0 1.5rem; }

    .cta {
      display: block;
      background: var(--teal);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.15rem;
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      box-shadow: 0 6px 18px rgba(47,138,115,.28);
      transition: background .15s, transform .1s;
    }
    .cta:hover { background: var(--teal-dark); }
    .cta:active { transform: scale(.98); }
    .note { color: var(--muted); font-size: .85rem; margin: .65rem 0 0; }

    .shot {
      display: block;
      width: 78%;
      max-width: 17rem;
      height: auto;
      margin: 2rem auto 0;
      border-radius: 1.6rem;
      border: 6px solid #fff;
      box-shadow: 0 14px 40px rgba(31,27,24,.12);
    }

    .points { list-style: none; padding: 0; margin: 2rem 0 0; text-align: left; }
    .points li { display: flex; gap: .7rem; align-items: baseline; padding: .8rem 0; border-top: 1px solid var(--line); }
    .points li:last-child { border-bottom: 1px solid var(--line); }
    .points li::before { content: "✓"; color: var(--teal); font-weight: 800; }

    .again { margin-top: 2rem; }

    footer { color: var(--muted); font-size: .8rem; padding: 0 1.25rem calc(2rem + env(safe-area-inset-bottom)); }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="get-icon.png" alt="" width="32" height="32">鎖上學 Lock N' Learn</div>

    <h1>孩子想玩 iPad？<br>先寫一個中文字。</h1>
    <p class="sub">寫對了，遊戲才會打開。</p>

    <a class="cta" data-tap="top" href="https://apps.apple.com/app/apple-store/id6811321479?pt=129418115&amp;ct=fb-ad03&amp;mt=8">App Store 下載</a>
    <p class="note">iPhone / iPad · 不用註冊</p>

    <img class="shot" src="get-wo.jpg" width="571" height="900" alt="鎖上學：看注音，寫出「我」字">

    <ul class="points">
      <li>依年級出字，看注音寫出漢字</li>
      <li>家長選哪些 App 要先寫字</li>
      <li>沒有廣告，家長設定有密碼保護</li>
    </ul>

    <div class="again">
      <a class="cta" data-tap="bottom" href="https://apps.apple.com/app/apple-store/id6811321479?pt=129418115&amp;ct=fb-ad03&amp;mt=8">App Store 下載</a>
    </div>
  </main>

  <footer>
    <a href="privacy.html">隱私權 · Privacy</a>
    <p class="owner">© 2026 Brendan Mullan · Lock &amp; Learn 鎖上學</p>
  </footer>

  <script>
    // Simple counts, no cookies: page visits and App Store button taps.
    (function () {
      var host = location.hostname;
      if (!/github\.io$/.test(host)) return; // don't count local previews
      var base = "https://abacus.jasoncameron.dev/hit/locknlearn-tw/";
      function hit(key) {
        try { fetch(base + key, { mode: "no-cors", keepalive: true }); } catch (e) {}
      }
      hit("get-view");
      document.querySelectorAll("[data-tap]").forEach(function (a) {
        a.addEventListener("click", function () {
          hit("get-tap");
          hit("get-tap-" + a.getAttribute("data-tap"));
        });
      });
    })();
  </script>
</body>
</html>
